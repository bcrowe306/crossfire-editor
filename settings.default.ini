; Odin SDL Editor settings: the defaults.
;
; This file is built into the editor (settings.odin loads it with #load). The editor saves your
; changes to editor.ini next to its executable; anything missing there falls back to these
; values. Edit settings in the editor (Edit > Settings, Ctrl+,) rather than by hand.

[appearance]
; dark or light
theme = dark
; Body text size in pixels; the other text sizes scale with it (Skald's default is 14)
font_size = 13
; Padding and gaps, in percent of Skald's default spacing scale (4, 8, 12, 16, 24 px)
spacing = 75
; Height of a row in the project browser and scene tree, in pixels
row_height = 26

[theme]
; The editor's look over the base theme (Settings > Appearance, editor_theme.odin): the corners'
; roundness in percent of Skald's, and any of the theme's colors as #RRGGBB or #RRGGBBAA:
; bg, surface, elevated, border, fg, fg_muted, primary, on_primary, selection, success, warning,
; danger. A color not set is the base theme's
corner_radius = 100

[editor]
; Edits of the same thing closer together than this (in milliseconds) undo as one step:
; typing a name, dragging a number, nudging with the arrow keys
undo_merge_ms = 500
; A run of merged edits is cut into a new undo step after this long (milliseconds; 0 = never)
undo_group_max_ms = 3000
; Undo steps kept; the oldest are dropped
undo_limit = 200
; Open scripts in the editor's own code editor (a tab next to the scenes). false: in the program
; below instead
code_editor_builtin = true
; The built-in code editor closes brackets and quotes as you type them: ( [ { " ' ` and < (after
; a name, or anywhere in XML)
code_editor_auto_close = true
; The Odin language server the built-in code editor uses for completion and diagnostics: a path
; or a name in PATH. Empty: ols in PATH, then code_editor/third_party/ols, then Zed's
ols_path =
; The odin compiler games are built with: a path or a name in PATH. Empty: odin in PATH, else the
; one Settings > Toolchain installs
odin_path =
; The LDtk level editor (ldtk.io), which Open in LDtk starts: a path or a name in PATH. Empty: ldtk
ldtk_path =
; The Aseprite pixel art editor (aseprite.org), which Open in Aseprite starts: a path or a name in
; PATH. Empty: aseprite
aseprite_path =
; The program that opens scripts when the built-in editor is off: the path to its executable, or a name to look up in PATH.
; It runs in the project's scripts folder, with the editor's environment
code_editor_path = zed
; Its arguments, split on spaces: {file}, {line} and {folder} are replaced (without {file}, the
; file is added at the end). {folder} is the project's scripts folder: opening it as the editor's
; workspace lets the Odin language server find scripts/ols.json (written by the editor), for code
; completion. Zed: {folder} {file}:{line}  VS Code: {folder} --goto {file}:{line}
code_editor_args = {folder} {file}:{line}
; Build the game for Play with optimizations: faster games, but about 50 s per build instead of 4
optimized_play = false
; Scripts saved while the game plays rebuild it in the background, then restart it where it was:
; the same scene, the globals and every node's properties (positions, script fields...)
hot_reload = true
viewport_wheel_pans = false
; Snapping steps of the viewport's Rotate and Scale drags (snapping on, or Shift held): degrees,
; and a scale step
rotate_snap = 15
scale_snap = 0.1
; The folder files were last imported from: Import (Ctrl+I) opens there (empty: the home folder)
import_folder =
; The sound device for Play and the editor's previews, by name (empty: the system's default)
audio_device =

[keymap]
; action = chord, or two chords separated by " | ". Leave empty to unbind.
; Modifiers: Ctrl, Shift, Alt, Super. Keys: A-Z, 0-9, F1-F12, Left, Right, Up, Down, Home,
; End, PageUp, PageDown, Enter, Tab, Esc, Space, Del, and - = [ ] ; ' , . / \ `
New_Project = Ctrl+N
Open_Project = Ctrl+O
Save_Project = Ctrl+S
Save_Project_As = Ctrl+Shift+S
Export = Ctrl+Shift+E
Export_Project_Archive =
Export_Project_Archive_With_History =
Open_Project_Archive =
