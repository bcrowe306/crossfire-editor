; Odin SDL Editor settings: the defaults.
;
; This file is built into the editor (settings.odin loads it with #load). The editor saves your
; changes to editor.ini next to its executable; anything missing there falls back to these
; values. Edit settings in the editor (Edit > Settings, Ctrl+,) rather than by hand.

[appearance]
; dark or light
theme = dark
; Body text size in pixels; the other text sizes scale with it (Skald's default is 14)
font_size = 13
; Padding and gaps, in percent of Skald's default spacing scale (4, 8, 12, 16, 24 px)
spacing = 75
; Height of a row in the project browser and scene tree, in pixels
row_height = 26

[editor]
; Edits of the same thing closer together than this (in milliseconds) undo as one step:
; typing a name, dragging a number, nudging with the arrow keys
undo_merge_ms = 500
; A run of merged edits is cut into a new undo step after this long (milliseconds; 0 = never)
undo_group_max_ms = 3000
; Undo steps kept; the oldest are dropped
undo_limit = 200
; Viewport grid spacing in world units (G shows it, Shift+G snaps to it)
grid_size = 32
; The program that opens scripts: the path to its executable, or a name to look up in PATH.
; It runs in the project's scripts folder, with the editor's environment
code_editor_path = zed
; Its arguments, split on spaces: {file} and {line} are replaced (without {file}, the file is
; added at the end). Zed: {file}:{line}  VS Code: --goto {file}:{line}  Neovim GUI: +{line} {file}
code_editor_args = {file}:{line}
; Build the game for Play with optimizations: faster games, but about 50 s per build instead of 4
optimized_play = false

[keymap]
; action = chord, or two chords separated by " | ". Leave empty to unbind.
; Modifiers: Ctrl, Shift, Alt, Super. Keys: A-Z, 0-9, F1-F12, Left, Right, Up, Down, Home,
; End, PageUp, PageDown, Enter, Tab, Esc, Space, Del, and - = [ ] ; ' , . / \ `
New_Project = Ctrl+N
Open_Project = Ctrl+O
Save_Project = Ctrl+S
Export = Ctrl+Shift+E
Quit = Ctrl+Q
Undo = Ctrl+Z
Redo = Ctrl+Shift+Z | Ctrl+Y
Add_Node = Ctrl+Shift+A
Delete_Node = Del
Duplicate_Node = Ctrl+D
Copy_Node = Ctrl+C
Cut_Node = Ctrl+X
Paste_Node = Ctrl+V
Rename_Node = F2
Select_All = Ctrl+A
Toggle_Grid = G
Toggle_Snap = Shift+G
Play = F5
Pause = F6
Stop = Shift+F5
Toggle_Bottom_Panel = Ctrl+J
Clear_Console =
About =
Tool_Select = Q
Tool_Move = W
Tool_Rotate = E
Tool_Scale = R
Frame_Selected = F
View_Fit = Ctrl+0
Zoom_In = Ctrl+=
Zoom_Out = Ctrl+-
Zoom_100 = Ctrl+1
Toggle_Animation = P
Deselect = Esc
Nudge_Left = Left
Nudge_Right = Right
Nudge_Up = Up
Nudge_Down = Down
Nudge_Left_Large = Shift+Left
Nudge_Right_Large = Shift+Right
Nudge_Up_Large = Shift+Up
Nudge_Down_Large = Shift+Down
Import_Asset = Ctrl+I
Remove_Asset =
Toggle_Preview_Panel =
Play_Audio_Preview =
Stop_Audio_Preview =
Open_Settings = Ctrl+,
Build_Scripts = Ctrl+B
Open_Script =
