# yaml-language-server: $schema=https://taskfile.dev/schema.json

# Build, run and test commands for the editor. `task` with no arguments lists them.

version: '3'

vars:
  NAME: crossfire-editor
  BUILD_DIR: build
  # Engine checkout: imported as "engine:." and used by Play to build the player.
  # Override with: task run ENGINE_DIR=/path/to/odin_sdl_engine
  ENGINE_DIR: '{{.ENGINE_DIR | default "../odin_sdl_engine"}}'
  DEMO_PROJECT: examples/demo_project
  # This machine's prebuilt-player folder name (the editor's ExportTarget, lowercased)
  PREBUILT_TARGET:
    sh: 'case "$(uname -s)-$(uname -m)" in Linux-x86_64) echo linux_x64;; Linux-aarch64) echo linux_arm64;; Darwin-arm64) echo macos_arm64;; Darwin-x86_64) echo macos_x64;; *) echo windows_x64;; esac'
  # UI tests run on a copy of this fixed project, not the demo (which `task run` opens and you edit)
  UI_PROJECT: tests/fixtures/ui_project
  # The version Help > About shows (EDITOR_VERSION): the nearest tag and commit
  VERSION:
    sh: 'echo "${VERSION:-$(git describe --tags --always 2>/dev/null || echo dev)}"'
  # Skald is imported as "gui:skald", the engine as "engine:."
  COLLECTIONS: -collection:gui=Skald -collection:engine={{.ENGINE_DIR}} -define:ENGINE_DIR={{.ENGINE_DIR}} -define:EDITOR_VERSION={{.VERSION}}
  # Emscripten, for web exports: the third_party/emsdk submodule is pinned to this release tag,
  # and `task emsdk` installs that version (keep them in step when updating)
  EMSDK_DIR: third_party/emsdk
  EMSDK_VERSION: 6.0.12
  # Vet only the editor's own package: Skald itself doesn't pass -vet
  VET: -vet-unused -vet-packages:crossfire_editor
  # Windows: the executable's icon (crossfire.rc)
  ICON_RESOURCE: '{{if eq OS "windows"}}-resource:crossfire.rc{{end}}'

# Building and bundling for macOS (an .app and a disk image): task macos:dist, task macos:verify
includes:
  linux:
    taskfile: ./Taskfile.linux.yml
    dir: .
  macos:
    taskfile: ./Taskfile.macos.yml
    dir: .
    vars:
      ENGINE_DIR: '{{.ENGINE_DIR}}'
      COLLECTIONS: '{{.COLLECTIONS}}'
      VET: '{{.VET}}'

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: One-time setup - fetch the submodules, build the STB libraries Skald needs and the engine's Box2D
    cmds:
      - task: submodules
      - task: stb
      - task: box2d

  box2d:
    desc: Build Box2D for the engine (its tools/build_box2d.sh, into <engine>/box2d/lib). Builds and checks run it when it's missing
    # Once per `task` run: several tasks depend on it, and Task would run it for each, in parallel
    run: once
    status:
      - test -f {{.ENGINE_DIR}}/box2d/lib/box2d_{{OS}}_{{ARCH}}.a
    cmds:
      - git -C {{.ENGINE_DIR}} submodule update --init third_party/box2d
      - '{{.ENGINE_DIR}}/tools/build_box2d.sh'

  prebuilt:
    desc: Build the engine's player (optimized, static SDL) as this platform's prebuilt player, beside the debug and release editors (build/prebuilt/<target>/player, build/release/prebuilt/...) - projects without scripts then play and export without compiling (releases ship one)
    # Once per `task` run: several tasks depend on it, and Task would run it for each, in parallel
    run: once
    deps: [box2d, sdl]
    sources:
      - '{{.ENGINE_DIR}}/*.odin'
      - '{{.ENGINE_DIR}}/player/*.odin'
    generates:
      - '{{.BUILD_DIR}}/prebuilt/{{.PREBUILT_TARGET}}/player'
    cmds:
      - mkdir -p {{.BUILD_DIR}}/prebuilt/{{.PREBUILT_TARGET}} {{.BUILD_DIR}}/release/prebuilt/{{.PREBUILT_TARGET}}
      - odin build {{.ENGINE_DIR}}/player -o:speed -out:{{.BUILD_DIR}}/prebuilt/{{.PREBUILT_TARGET}}/player
      - cp {{.BUILD_DIR}}/prebuilt/{{.PREBUILT_TARGET}}/player {{.BUILD_DIR}}/release/prebuilt/{{.PREBUILT_TARGET}}/player

  sdl:
    desc: Build the engine's static SDL (its tools/build_sdl_static.sh, into <engine>/sdl/lib; needs CMake). The editor and every game then link SDL in. A dependency of check, test, the builds and run; skipped when built. Linux, macOS and Windows (Visual Studio)
    # Once per `task` run: several tasks depend on it, and Task would run it for each, in parallel
    run: once
    status:
      - ls {{.ENGINE_DIR}}/sdl/lib/*/libSDL3.a || ls {{.ENGINE_DIR}}/sdl/lib/*/sdl3_static.lib
    cmds:
      - '{{.ENGINE_DIR}}/tools/build_sdl_static.sh'

  shadertools:
    desc: Build the shader compilers (glslang, SDL_shadercross) into <engine>/shader_tools (its tools/build_shader_tools.sh; needs CMake, a C++ compiler, Python 3). The editor compiles projects' GLSL shaders with them; skipped when built
    run: once
    deps: [sdl]
    status:
      - ls {{.ENGINE_DIR}}/shader_tools/*/shadercross*
    cmds:
      - '{{.ENGINE_DIR}}/tools/build_shader_tools.sh'

  box2d:web:
    desc: Build the engine's Box2D for web exports (needs emsdk). Exports also build it when it's missing
    status:
      - test -f {{.ENGINE_DIR}}/box2d/lib/box2d_web.o
    cmds:
      - git -C {{.ENGINE_DIR}} submodule update --init third_party/box2d
      - '{{.ENGINE_DIR}}/tools/build_box2d.sh "$(realpath {{.EMSDK_DIR}})"'

  submodules:
    desc: Fetch or update git submodules (Skald, emsdk)
    cmds:
      - git submodule update --init --recursive

  emsdk:
    desc: Install the Emscripten toolchain for web exports (about 1 GB into third_party/emsdk; once per machine)
    status:
      - test -x {{.EMSDK_DIR}}/upstream/emscripten/emcc
    cmds:
      - git submodule update --init {{.EMSDK_DIR}} third_party/SDL_mixer
      - cd {{.EMSDK_DIR}} && ./emsdk install {{.EMSDK_VERSION}} && ./emsdk activate {{.EMSDK_VERSION}}
      - task: web:mixer
      - task: box2d:web

  web:mixer:
    desc: Build SDL3_mixer for web exports (build/web/libSDL3_mixer.a, from third_party/SDL_mixer; needs emsdk). Exports also build it when it's missing
    sources:
      - tools/build_web_mixer.sh
      - third_party/SDL_mixer/src/**/*
      - third_party/SDL_mixer/include/**/*
    generates:
      - build/web/libSDL3_mixer.a
    cmds:
      - tools/build_web_mixer.sh {{.EMSDK_DIR}} third_party/SDL_mixer build/web

  stb:
    desc: Build Odin's STB libraries (once per Odin install; Linux and macOS)
    cmds:
      - cd "$(odin root)/vendor/stb/src" && sh build_stb.sh
    status:
      # Already built for this Odin install
      # (for this OS: Odin's Linux release carries the macOS libraries in lib/darwin/, not its own)
      - 'if [ "$(uname -s)" = Darwin ]; then test -f "$(odin root)/vendor/stb/lib/darwin/stb_truetype.a"; else test -f "$(odin root)/vendor/stb/lib/stb_truetype.a"; fi'

  check:
    desc: Type-check the editor with vet
    deps: [box2d, sdl]
    cmds:
      - odin check . {{.COLLECTIONS}} {{.VET}}

  test:
    desc: Run the unit tests
    deps: [box2d, sdl]
    cmds:
      # A leak or bad free fails the test
      - odin test . {{.COLLECTIONS}} {{.VET}} -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true

  test:code-editor:
    desc: Unit tests of the built-in code editor's own packages (code_editor/, its Taskfile)
    dir: code_editor
    cmds:
      - task test

  ols:
    desc: Build the Odin language server the built-in code editor uses, into code_editor/third_party/ols (clones OLS at a pinned commit); not needed when ols is in PATH or Zed has one
    # Once per `task` run: several tasks depend on it, and Task would run it for each, in parallel
    run: once
    dir: code_editor
    status:
      - test -x third_party/ols/ols
    cmds:
      - task ols:build

  verify:
    desc: Check and test (run before saying a change works)
    cmds:
      - task: check
      - task: test

  test:ui:
    desc: Run the UI test scripts in tests/ui (opens the editor window; uses a copy of tests/fixtures/ui_project); SCRIPT=<file> runs one
    deps: [build, prebuilt, ols, shadertools]  # ols: toolchain.script expects a language server; shaders.script compiles
    env:
      # The Git tab's script commits: a name and email, whatever git is set up with
      GIT_AUTHOR_NAME: UI test
      GIT_AUTHOR_EMAIL: ui-test@example.com
      GIT_COMMITTER_NAME: UI test
      GIT_COMMITTER_EMAIL: ui-test@example.com
    cmds:
      # Each script starts from a fresh copy of the project (scripts save and rename things) and
      # tests/ui/settings.ini (the defaults, but opening scripts runs nothing), in a scratch file:
      # never your editor.ini
      - for: { var: UI_SCRIPTS }
        cmd: 'rm -rf {{.BUILD_DIR}}/ui_project {{.BUILD_DIR}}/ui_archive && cp -r {{.UI_PROJECT}} {{.BUILD_DIR}}/ui_project && cp tests/ui/settings.ini {{.BUILD_DIR}}/ui_settings.ini && {{.BUILD_DIR}}/{{.NAME}} {{.BUILD_DIR}}/ui_project --script {{.ITEM}} --settings {{.BUILD_DIR}}/ui_settings.ini'
    vars:
      UI_SCRIPTS:
        sh: echo "${SCRIPT:-$(ls tests/ui/*.script)}"

  test:ui:fullscreen:
    desc: The UI test scripts in a fullscreen editor (the wide layouts a tiled window never gets); SCRIPT=<file> runs one
    deps: [box2d, sdl, prebuilt, ols, shadertools]
    env:
      # The Git tab's script commits: a name and email, whatever git is set up with
      GIT_AUTHOR_NAME: UI test
      GIT_AUTHOR_EMAIL: ui-test@example.com
      GIT_COMMITTER_NAME: UI test
      GIT_COMMITTER_EMAIL: ui-test@example.com
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - odin build . {{.COLLECTIONS}} {{.VET}} -debug -define:EDITOR_FULLSCREEN=true -out:{{.BUILD_DIR}}/{{.NAME}}_fullscreen {{.ICON_RESOURCE}}
      - for: { var: UI_SCRIPTS }
        cmd: 'rm -rf {{.BUILD_DIR}}/ui_project {{.BUILD_DIR}}/ui_archive && cp -r {{.UI_PROJECT}} {{.BUILD_DIR}}/ui_project && cp tests/ui/settings.ini {{.BUILD_DIR}}/ui_settings.ini && {{.BUILD_DIR}}/{{.NAME}}_fullscreen {{.BUILD_DIR}}/ui_project --script {{.ITEM}} --settings {{.BUILD_DIR}}/ui_settings.ini'
    vars:
      UI_SCRIPTS:
        sh: echo "${SCRIPT:-$(ls tests/ui/*.script)}"

  build:
    desc: Debug build into build/
    deps: [box2d, sdl]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - odin build . {{.COLLECTIONS}} {{.VET}} -debug -out:{{.BUILD_DIR}}/{{.NAME}} {{.ICON_RESOURCE}}

  build:release:
    desc: Optimized build into build/release/
    deps: [box2d, sdl]
    cmds:
      - mkdir -p {{.BUILD_DIR}}/release
      - odin build . {{.COLLECTIONS}} {{.VET}} -o:speed -out:{{.BUILD_DIR}}/release/{{.NAME}} {{.ICON_RESOURCE}}

  run:
    desc: Build optimized and run. Pass program arguments after --, e.g. task run -- path/to/project
    deps: [box2d, sdl, prebuilt, shadertools]
    # Optimized: the debug build is several times slower (the viewport ran at ~14 fps vs 60)
    cmds:
      - mkdir -p {{.BUILD_DIR}}/release
      - odin build . {{.COLLECTIONS}} -o:speed -out:{{.BUILD_DIR}}/release/{{.NAME}} {{.ICON_RESOURCE}}
      - '{{.BUILD_DIR}}/release/{{.NAME}} {{.CLI_ARGS}}'

  run:debug:
    desc: Build with debug info (unoptimized, slower) and run, for a debugger or bounds checks
    deps: [box2d, sdl]
    cmds:
      - odin run . {{.COLLECTIONS}} -debug -- {{.CLI_ARGS}}

  run:fullscreen:
    desc: Build optimized and run fullscreen, to see the full layout on a tiling window manager
    deps: [box2d, sdl]
    cmds:
      - mkdir -p {{.BUILD_DIR}}/release
      - odin build . {{.COLLECTIONS}} -o:speed -define:EDITOR_FULLSCREEN=true -out:{{.BUILD_DIR}}/release/{{.NAME}}-fullscreen {{.ICON_RESOURCE}}
      - '{{.BUILD_DIR}}/release/{{.NAME}}-fullscreen {{.CLI_ARGS}}'

  player:
    desc: Build the engine's game player (Play does this automatically when the engine changed)
    deps: [box2d, sdl]
    cmds:
      - mkdir -p {{.BUILD_DIR}}/player
      - odin build {{.ENGINE_DIR}}/player -o:speed -out:{{.BUILD_DIR}}/player/player

  play:demo:
    desc: Run the demo project in the player, without the editor
    deps: [player]
    cmds:
      - '{{.BUILD_DIR}}/player/player {{.DEMO_PROJECT}}'

  clean:
    desc: Delete build output
    cmds:
      - rm -rf {{.BUILD_DIR}} {{.NAME}}
