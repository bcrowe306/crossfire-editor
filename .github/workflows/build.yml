# Builds and tests the editor on Linux x86_64, Windows x86_64 and macOS arm64 when a version tag is pushed
# (v1.2.3, v0.1.0-dev.4), and makes a GitHub release of it for each, if all pass. Tags with a "-"
# make pre-releases. Can also be run by hand (Actions > Build).
#
# The engine is checked out next to the editor (odin_sdl_engine, its main branch), as in a local
# workspace; its tools/ci/setup.sh installs Odin and SDL3.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      engine_ref:
        description: Engine branch, tag or commit to build with
        default: main

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: windows-2022, platform: windows-x64 }
          - { os: macos-15, platform: macos-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: odin_sdl_editor
    env:
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
      COLLECTIONS: -collection:gui=Skald -collection:engine=../odin_sdl_engine -define:ENGINE_DIR=../odin_sdl_engine
    steps:
      - uses: actions/checkout@v4
        with:
          path: odin_sdl_editor
      - name: Submodules (Skald, SDL_mixer; not the 1 GB emsdk)
        run: git submodule update --init --depth 1 Skald third_party/SDL_mixer

      - uses: actions/checkout@v4
        with:
          repository: bcrowe306/crossfire-engine
          ref: ${{ inputs.engine_ref || 'main' }}
          path: odin_sdl_engine
          submodules: true

      - name: Cache SDL3 (Linux builds it from source)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/sdl3
          key: sdl3-${{ runner.os }}-3.4.16-3.4.6-3.2.2-3.2.4

      - name: Set up Odin and SDL3
        run: ../odin_sdl_engine/tools/ci/setup.sh

      # Linux: built against glibc 2.31 with zig, so releases run on older distributions too
      - name: zig, for an old glibc
        if: runner.os == 'Linux'
        run: ../odin_sdl_engine/tools/ci/zig_toolchain.sh

      - name: Build Box2D
        run: ../odin_sdl_engine/tools/build_box2d.sh

      - name: Cache static SDL
        uses: actions/cache@v4
        with:
          path: odin_sdl_engine/sdl/lib
          key: sdl-static-zig-glibc2.31-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('odin_sdl_engine/tools/build_sdl_static.sh', 'odin_sdl_engine/.gitmodules') }}-3.4.16-3.4.6-3.2.2-3.2.4

      - name: Build static SDL (games and the editor link it)
        run: |
          if ! compgen -G "../odin_sdl_engine/sdl/lib/*/libSDL3.a" > /dev/null && ! compgen -G "../odin_sdl_engine/sdl/lib/*/sdl3_static.lib" > /dev/null; then ../odin_sdl_engine/tools/build_sdl_static.sh; fi

      - name: Cache shader tools
        uses: actions/cache@v4
        with:
          path: odin_sdl_engine/shader_tools
          key: shader-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('odin_sdl_engine/tools/build_shader_tools.sh', 'odin_sdl_engine/.gitmodules') }}-glslang16.6.0-spirvcross1.4.363.0

      - name: Build shader tools (glslang and SDL_shadercross, for projects' shaders)
        env:
          # Fewer parallel compiles on Linux: zig's C++ compiler ran out of the runner's memory
          SHADER_TOOLS_JOBS: ${{ runner.os == 'Linux' && '2' || '' }}
        run: |
          if ! compgen -G "../odin_sdl_engine/shader_tools/*/shadercross*" > /dev/null; then ../odin_sdl_engine/tools/build_shader_tools.sh; fi

      - name: Check
        run: odin check . $COLLECTIONS -vet-unused -vet-packages:crossfire_editor

      - name: Test
        # The tests take seconds: a hang (a crashed test thread on Windows) shouldn't hold the runner
        timeout-minutes: 10
        run: odin test . $COLLECTIONS -vet-unused -vet-packages:crossfire_editor $ODIN_LINK_FLAGS

      - name: Package the editor
        if: runner.os != 'macOS'
        run: tools/ci/package_editor.sh ${{ matrix.platform }} ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      # A game exported from the packaged editor, headless (--export), starts and quits cleanly
      # (the player's --quit-after) on this OS
      - name: Export a game and run it
        if: runner.os != 'macOS'
        run: |
          project="$RUNNER_TEMP/export-test/game"
          rm -rf "$RUNNER_TEMP/export-test" && mkdir -p "$RUNNER_TEMP/export-test" && cp -r tests/fixtures/ui_project "$project"
          # The release archive as a user gets it
          cd "$RUNNER_TEMP/export-test"
          if [[ "$RUNNER_OS" == Windows ]]; then 7z x -bso0 "$GITHUB_WORKSPACE"/odin_sdl_editor/dist/crossfire-editor-*.zip; else tar -xzf "$GITHUB_WORKSPACE"/odin_sdl_editor/dist/crossfire-editor-*.tar.gz; fi
          stage=$(ls -d "$RUNNER_TEMP"/export-test/crossfire-editor-*-${{ matrix.platform }} | head -1)
          if [[ "$RUNNER_OS" == Windows ]]; then
            "$stage/crossfire-editor.exe" "$project" --export Windows_x64
            "$project/export/windows_x64/Asteroids_Demo.exe" --quit-after 3
          else
            "$stage/crossfire-editor" "$project" --export Linux_x64
            "$project/export/linux_x64/Asteroids_Demo" --quit-after 3
          fi
          # This platform's prebuilt player, for every release (the combine jobs)
          mkdir -p "$GITHUB_WORKSPACE/odin_sdl_editor/players"
          cp -r "$stage"/prebuilt/* "$GITHUB_WORKSPACE/odin_sdl_editor/players/"

      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: player-${{ matrix.platform }}
          path: odin_sdl_editor/players/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: editor-${{ matrix.platform }}
          path: odin_sdl_editor/dist/*
          if-no-files-found: error

      # macOS: the same tasks you'd run by hand (Taskfile.macos.yml): a self-contained .app in a
      # disk image, then installed from it and tested
      - name: Install Task
        if: runner.os == 'macOS'
        run: brew install go-task

      - name: macOS bundling tools
        if: runner.os == 'macOS'
        run: task macos:deps

      - name: Build the app and its disk image
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: task macos:dist

      - name: Export a macOS game and run it
        if: runner.os == 'macOS'
        run: |
          project="$RUNNER_TEMP/export-test/game"
          rm -rf "$RUNNER_TEMP/export-test" && mkdir -p "$RUNNER_TEMP/export-test" && cp -r tests/fixtures/ui_project "$project"
          app=$(ls -d dist/macos/*.app | head -1)
          "$app/Contents/MacOS/crossfire-editor" "$project" --export macOS_ARM64
          "$project/export/macos_arm64/Asteroids_Demo.app/Contents/MacOS/Asteroids_Demo" --quit-after 3

      - name: Install the disk image and check the bundle
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: UI=false task macos:verify

      - name: UI tests with the installed app
        if: runner.os == 'macOS'
        # MoltenVK gets a Metal device on GitHub's macOS runners: the installed app opens its window
        timeout-minutes: 20
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: task macos:verify

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: editor-${{ matrix.platform }}
          path: odin_sdl_editor/dist/macos/*.dmg
          if-no-files-found: error

      - name: Keep the prebuilt player
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d dist/macos/*.app | head -1)
          mkdir -p players && cp -r "$app"/Contents/MacOS/prebuilt/* players/

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: player-${{ matrix.platform }}
          path: odin_sdl_editor/players/
          if-no-files-found: error

  # Every release carries every platform's prebuilt player, so an editor exports games without
  # scripts for any desktop OS: the archives get the others' players beside their own...
  combine:
    name: Every player in the archives
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: editor
      - uses: actions/download-artifact@v4
        with:
          pattern: player-*
          path: players
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: editor-*-x64
          path: dist
          merge-multiple: true
      - name: Add the players
        run: |
          chmod +x players/*/player 2>/dev/null || true
          mkdir -p combined && cd combined
          for archive in ../dist/*.tar.gz ../dist/*.zip; do
            [[ -e "$archive" ]] || continue
            rm -rf work && mkdir work
            case "$archive" in
              *.tar.gz) tar -xzf "$archive" -C work ;;
              *.zip) unzip -q "$archive" -d work ;;
            esac
            top=$(ls work)
            for target in ../players/*; do
              name=$(basename "$target")
              [[ -e "work/$top/prebuilt/$name" ]] || cp -r "$target" "work/$top/prebuilt/$name"
            done
            case "$archive" in
              *.tar.gz) tar -czf "$(basename "$archive")" -C work "$top" ;;
              *.zip) (cd work && zip -qry "../$(basename "$archive")" "$top") ;;
            esac
            ls -la "$(basename "$archive")"
          done
          rm -rf work
      # The AppImage, from the Linux archive with every player (tools/linux/make_appimage.sh)
      - name: The AppImage
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          linux=$(ls combined/crossfire-editor-*-linux-x64.tar.gz | head -1)
          rm -rf appimage && mkdir appimage && tar -xzf "$linux" -C appimage
          editor/tools/linux/make_appimage.sh "appimage/$(ls appimage)" "combined/Crossfire_Editor-$VERSION-x86_64.AppImage"
          rm -rf appimage
      - uses: actions/upload-artifact@v4
        with:
          name: final-archives
          path: combined/*
          if-no-files-found: error

  # The Windows installer (Inno Setup, preinstalled on GitHub's Windows runners), from the archive
  # with every player
  windows-installer:
    name: Windows installer
    needs: combine
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: editor
      - uses: actions/download-artifact@v4
        with:
          name: final-archives
          path: combined
      - name: Compile the installer
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          zip=$(ls combined/crossfire-editor-*-windows-x64.zip | head -1)
          mkdir -p release installer && 7z x -bso0 -orelease "$zip"
          source=$(cygpath -w "$PWD/release/$(ls release)")
          # Git Bash would turn the /D... options into paths: off for this call
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL="*" "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DSourceDir=$source" "/DAppVersion=$VERSION" "/DOutputDir=$(cygpath -w "$PWD/installer")" editor/tools/windows/crossfire-editor.iss
          ls -la installer
      - uses: actions/upload-artifact@v4
        with:
          name: final-installer
          path: installer/*.exe
          if-no-files-found: error

  # ...and the macOS app gets them in Contents/Resources/prebuilt (codesign takes only Mac programs
  # in Contents/MacOS), signed again
  combine-macos:
    name: Every player in the macOS app
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: editor
      - name: dmgbuild
        run: python3 -m pip install --user --upgrade dmgbuild || python3 -m pip install --user --upgrade --break-system-packages dmgbuild
      - uses: actions/download-artifact@v4
        with:
          pattern: player-*
          path: players
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: editor-macos-arm64
          path: dist
      - name: Add the players and make the disk image again
        run: |
          chmod +x players/*/player 2>/dev/null || true
          dmg=$(ls dist/*.dmg | head -1)
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -quiet
          work=$(mktemp -d)
          cp -R "$mount"/*.app "$work/"
          hdiutil detach "$mount" -quiet
          app=$(ls -d "$work"/*.app | head -1)
          mkdir -p "$app/Contents/Resources/prebuilt"
          for target in players/*; do
            name=$(basename "$target")
            [[ -e "$app/Contents/MacOS/prebuilt/$name" ]] || cp -R "$target" "$app/Contents/Resources/prebuilt/$name"
          done
          codesign --force --deep -s - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p combined
          # The same window as task macos:dmg's (its background, icon places)
          (cd editor && python3 -m dmgbuild -s tools/macos/dmg_settings.py -D app="$app" -D background="$PWD/assets/dmg/background.tiff" "Crossfire Editor" "$GITHUB_WORKSPACE/combined/$(basename "$dmg")")
      - uses: actions/upload-artifact@v4
        with:
          name: final-dmg
          path: combined/*.dmg
          if-no-files-found: error

  release:
    name: Release
    needs: [combine, combine-macos, windows-installer]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: final-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--title "Crossfire Editor $TAG" --generate-notes)
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* "${flags[@]}" -R "$GITHUB_REPOSITORY"
